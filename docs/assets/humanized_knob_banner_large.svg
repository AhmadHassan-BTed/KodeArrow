<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Studio Background -->
    <radialGradient id="bgLg" cx="22%" cy="45%" r="85%">
      <stop offset="0%" stop-color="#181D29" />
      <stop offset="55%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#040608" />
    </radialGradient>

    <!-- Metallic Knob Bezel Gradient -->
    <linearGradient id="bezelLg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A465C" />
      <stop offset="50%" stop-color="#141822" />
      <stop offset="100%" stop-color="#242B3A" />
    </linearGradient>

    <radialGradient id="capLg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1F2637" />
      <stop offset="70%" stop-color="#0F131D" />
      <stop offset="100%" stop-color="#080A0E" />
    </radialGradient>

    <linearGradient id="needleLg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>

    <filter id="glowLg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Banner Card Base -->
  <rect width="1280" height="640" rx="40" fill="url(#bgLg)" stroke="#1B2230" stroke-width="2.5" />

  <!-- LEFT: PERFECTLY CENTERED ROTARY KNOB -->
  <!-- Center is at (260, 320). Leftmost point is 260 - 154 = 106px. Clean 106px left margin! -->
  <g id="knobLeft">
    <!-- Radial Gauge Ticks -->
    <g id="lgTicks">
      <line x1="168.1" y1="411.9" x2="151.1" y2="428.9" stroke="#00F2FE" stroke-width="4.8" stroke-linecap="round" opacity="0.50" />
      <line x1="151.9" y1="392.2" x2="140.3" y2="400.0" stroke="#00F2FE" stroke-width="3.2" stroke-linecap="round" opacity="0.52" />
      <line x1="139.9" y1="369.7" x2="127.0" y2="375.1" stroke="#00F2FE" stroke-width="3.2" stroke-linecap="round" opacity="0.54" />
      <line x1="132.5" y1="345.4" x2="118.8" y2="348.1" stroke="#00F2FE" stroke-width="3.2" stroke-linecap="round" opacity="0.56" />
      <line x1="130.0" y1="320.0" x2="116.0" y2="320.0" stroke="#00F2FE" stroke-width="3.2" stroke-linecap="round" opacity="0.58" />
      <line x1="132.5" y1="294.6" x2="118.8" y2="291.9" stroke="#00F2FE" stroke-width="3.2" stroke-linecap="round" opacity="0.60" />
      <line x1="139.9" y1="270.3" x2="117.7" y2="261.1" stroke="#00F2FE" stroke-width="4.8" stroke-linecap="round" opacity="0.62" />
      <line x1="151.9" y1="247.8" x2="140.3" y2="240.0" stroke="#00F2FE" stroke-width="3.2" stroke-linecap="round" opacity="0.65" />
      <line x1="168.1" y1="228.1" x2="158.2" y2="218.2" stroke="#A855F7" stroke-width="3.2" stroke-linecap="round" opacity="0.85" />
      <line x1="187.8" y1="211.9" x2="180.0" y2="200.3" stroke="#A855F7" stroke-width="3.2" stroke-linecap="round" opacity="0.85" />
      <line x1="210.3" y1="199.9" x2="204.9" y2="187.0" stroke="#A855F7" stroke-width="3.2" stroke-linecap="round" opacity="0.85" />
      <line x1="234.6" y1="192.5" x2="231.9" y2="178.8" stroke="#A855F7" stroke-width="3.2" stroke-linecap="round" opacity="0.85" />
      <line x1="260.0" y1="190.0" x2="260.0" y2="166.0" stroke="#A855F7" stroke-width="4.8" stroke-linecap="round" opacity="0.85" />
      <line x1="285.4" y1="192.5" x2="288.1" y2="178.8" stroke="#A855F7" stroke-width="3.2" stroke-linecap="round" opacity="0.85" />
      <line x1="309.7" y1="199.9" x2="315.1" y2="187.0" stroke="#A855F7" stroke-width="3.2" stroke-linecap="round" opacity="0.85" />
      <line x1="332.2" y1="211.9" x2="340.0" y2="200.3" stroke="#A855F7" stroke-width="3.2" stroke-linecap="round" opacity="0.85" />
      <line x1="351.9" y1="228.1" x2="361.8" y2="218.2" stroke="#A855F7" stroke-width="3.2" stroke-linecap="round" opacity="0.85" />
      <line x1="368.1" y1="247.8" x2="379.7" y2="240.0" stroke="#FF7A00" stroke-width="3.2" stroke-linecap="round" opacity="1.00" />
      <line x1="380.1" y1="270.3" x2="402.3" y2="261.1" stroke="#FF7A00" stroke-width="4.8" stroke-linecap="round" opacity="1.00" />
      <line x1="387.5" y1="294.6" x2="401.2" y2="291.9" stroke="#FF7A00" stroke-width="3.2" stroke-linecap="round" opacity="1.00" />
      <line x1="390.0" y1="320.0" x2="404.0" y2="320.0" stroke="#FF7A00" stroke-width="3.2" stroke-linecap="round" opacity="1.00" />
      <line x1="387.5" y1="345.4" x2="401.2" y2="348.1" stroke="#FF7A00" stroke-width="3.2" stroke-linecap="round" opacity="1.00" />
      <line x1="380.1" y1="369.7" x2="393.0" y2="375.1" stroke="#FF7A00" stroke-width="3.2" stroke-linecap="round" opacity="1.00" />
      <line x1="368.1" y1="392.2" x2="379.7" y2="400.0" stroke="#FF7A00" stroke-width="3.2" stroke-linecap="round" opacity="1.00" />
      <line x1="351.9" y1="411.9" x2="368.9" y2="428.9" stroke="#FF7A00" stroke-width="4.8" stroke-linecap="round" opacity="1.00" />
      <!-- "AI" Label on bottom-left -->
      <text x="110" y="455" font-family="'Segoe UI', Roboto, 'Inter', sans-serif" font-size="19" font-weight="900" letter-spacing="2.5" fill="#00F2FE" filter="url(#glowLg)">
        AI
      </text>
      <!-- "HUMAN" Label on bottom-right -->
      <text x="336" y="455" font-family="'Segoe UI', Roboto, 'Inter', sans-serif" font-size="19" font-weight="900" letter-spacing="2.5" fill="#FF7A00" filter="url(#glowLg)">
        HUMAN
      </text>
    </g>

    <!-- Knob Chassis -->
    <g id="lgKnob" filter="url(#shadowLg)">
      <!-- Outer knurled bezel -->
      <circle cx="260" cy="320" r="98" fill="url(#bezelLg)" stroke="#3E4D66" stroke-width="2.4" />
      <circle cx="260" cy="320" r="93" fill="none" stroke="#06080C" stroke-width="3.2" stroke-dasharray="3 4" opacity="0.7" />
      <circle cx="260" cy="320" r="86" fill="url(#capLg)" stroke="#1F2838" stroke-width="1.6" />
      <circle cx="260" cy="320" r="15" fill="#0C0F16" stroke="#2B364A" stroke-width="1.6" />

      <!-- Glowing Pointer Needle dialed into HUMAN -->
      <line x1="284.1" y1="310.3" x2="341.6" y2="287.0" stroke="url(#needleLg)" stroke-width="7.2" stroke-linecap="round" filter="url(#glowLg)" />
      <circle cx="341.6" cy="287.0" r="4.5" fill="#FFFFFF" filter="url(#glowLg)" />
    </g>
  </g>

  <!-- RIGHT: GITHUB HERO CONTENT (X=485, perfectly aligned with the knob) -->
  <g transform="translate(485, 0)">
    <!-- Brand Title -->
    <text x="0" y="240" font-family="'Segoe UI', Roboto, 'Inter', -apple-system, sans-serif" font-size="68" font-weight="900" letter-spacing="5" fill="#FFFFFF" filter="url(#shadowLg)">
      HUMANIZER
    </text>

    <!-- Subtitle: DIAL FROM AI TO HUMAN (Clean text, AI is glowing blue, Human is glowing orange) -->
    <text x="0" y="295" font-family="'Segoe UI', Roboto, 'Inter', sans-serif" font-size="22" font-weight="800" letter-spacing="4">
      <tspan fill="#8E9CB2">DIAL FROM </tspan>
      <tspan fill="#00F2FE" filter="url(#glowLg)">AI</tspan>
      <tspan fill="#8E9CB2"> TO </tspan>
      <tspan fill="#FF7A00" filter="url(#glowLg)">HUMAN</tspan>
    </text>

    <!-- Main Value Proposition -->
    <text x="0" y="380" font-family="'Segoe UI', Roboto, 'Inter', sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" fill-opacity="0.95">
      Clean your tracks. Remove AI watermarks.
    </text>

    <!-- Subtext -->
    <text x="0" y="420" font-family="'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="600" letter-spacing="1" fill="#64748B">
      Phase-neutral mathematical DSP • 100% audio quality retained
    </text>
  </g>
</svg>