<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bBg" cx="25%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#161B26" />
      <stop offset="60%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#05070A" />
    </radialGradient>

    <linearGradient id="bBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333E52" />
      <stop offset="50%" stop-color="#121620" />
      <stop offset="100%" stop-color="#242C3D" />
    </linearGradient>

    <radialGradient id="bCap" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1F2637" />
      <stop offset="70%" stop-color="#0F131D" />
      <stop offset="100%" stop-color="#090B10" />
    </radialGradient>

    <linearGradient id="bNeedle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>

    <filter id="bGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="bShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="960" height="320" rx="32" fill="url(#bBg)" stroke="#1B2230" stroke-width="2" />

  <!-- LEFT: ROTARY KNOB -->
  <g id="bannerKnobLeft">
    <g id="bTicks">
      <line x1="117.1" y1="227.9" x2="104.4" y2="240.6" stroke="#00F2FE" stroke-width="3.6" stroke-linecap="round" opacity="0.50" />
      <line x1="105.2" y1="213.3" x2="96.9" y2="218.9" stroke="#00F2FE" stroke-width="2.4" stroke-linecap="round" opacity="0.52" />
      <line x1="96.3" y1="196.7" x2="87.1" y2="200.6" stroke="#00F2FE" stroke-width="2.4" stroke-linecap="round" opacity="0.54" />
      <line x1="90.8" y1="178.7" x2="81.0" y2="180.7" stroke="#00F2FE" stroke-width="2.4" stroke-linecap="round" opacity="0.56" />
      <line x1="89.0" y1="160.0" x2="79.0" y2="160.0" stroke="#00F2FE" stroke-width="2.4" stroke-linecap="round" opacity="0.58" />
      <line x1="90.8" y1="141.3" x2="81.0" y2="139.3" stroke="#00F2FE" stroke-width="2.4" stroke-linecap="round" opacity="0.60" />
      <line x1="96.3" y1="123.3" x2="79.7" y2="116.4" stroke="#00F2FE" stroke-width="3.6" stroke-linecap="round" opacity="0.62" />
      <line x1="105.2" y1="106.7" x2="96.9" y2="101.1" stroke="#00F2FE" stroke-width="2.4" stroke-linecap="round" opacity="0.65" />
      <line x1="117.1" y1="92.1" x2="110.0" y2="85.0" stroke="#A855F7" stroke-width="2.4" stroke-linecap="round" opacity="0.85" />
      <line x1="131.7" y1="80.2" x2="126.1" y2="71.9" stroke="#A855F7" stroke-width="2.4" stroke-linecap="round" opacity="0.85" />
      <line x1="148.3" y1="71.3" x2="144.4" y2="62.1" stroke="#A855F7" stroke-width="2.4" stroke-linecap="round" opacity="0.85" />
      <line x1="166.3" y1="65.8" x2="164.3" y2="56.0" stroke="#A855F7" stroke-width="2.4" stroke-linecap="round" opacity="0.85" />
      <line x1="185.0" y1="64.0" x2="185.0" y2="46.0" stroke="#A855F7" stroke-width="3.6" stroke-linecap="round" opacity="0.85" />
      <line x1="203.7" y1="65.8" x2="205.7" y2="56.0" stroke="#A855F7" stroke-width="2.4" stroke-linecap="round" opacity="0.85" />
      <line x1="221.7" y1="71.3" x2="225.6" y2="62.1" stroke="#A855F7" stroke-width="2.4" stroke-linecap="round" opacity="0.85" />
      <line x1="238.3" y1="80.2" x2="243.9" y2="71.9" stroke="#A855F7" stroke-width="2.4" stroke-linecap="round" opacity="0.85" />
      <line x1="252.9" y1="92.1" x2="260.0" y2="85.0" stroke="#A855F7" stroke-width="2.4" stroke-linecap="round" opacity="0.85" />
      <line x1="264.8" y1="106.7" x2="273.1" y2="101.1" stroke="#FF7A00" stroke-width="2.4" stroke-linecap="round" opacity="1.00" />
      <line x1="273.7" y1="123.3" x2="290.3" y2="116.4" stroke="#FF7A00" stroke-width="3.6" stroke-linecap="round" opacity="1.00" />
      <line x1="279.2" y1="141.3" x2="289.0" y2="139.3" stroke="#FF7A00" stroke-width="2.4" stroke-linecap="round" opacity="1.00" />
      <line x1="281.0" y1="160.0" x2="291.0" y2="160.0" stroke="#FF7A00" stroke-width="2.4" stroke-linecap="round" opacity="1.00" />
      <line x1="279.2" y1="178.7" x2="289.0" y2="180.7" stroke="#FF7A00" stroke-width="2.4" stroke-linecap="round" opacity="1.00" />
      <line x1="273.7" y1="196.7" x2="282.9" y2="200.6" stroke="#FF7A00" stroke-width="2.4" stroke-linecap="round" opacity="1.00" />
      <line x1="264.8" y1="213.3" x2="273.1" y2="218.9" stroke="#FF7A00" stroke-width="2.4" stroke-linecap="round" opacity="1.00" />
      <line x1="252.9" y1="227.9" x2="265.6" y2="240.6" stroke="#FF7A00" stroke-width="3.6" stroke-linecap="round" opacity="1.00" />
      <text x="75" y="260" font-family="'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#00F2FE" filter="url(#bGlow)">
        AI
      </text>
      <text x="242" y="260" font-family="'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#FF7A00" filter="url(#bGlow)">
        HUMAN
      </text>
    </g>

    <g id="bKnob" filter="url(#bShadow)">
      <circle cx="185" cy="160" r="72" fill="url(#bBezel)" stroke="#38455C" stroke-width="1.8" />
      <circle cx="185" cy="160" r="68" fill="none" stroke="#07090E" stroke-width="2.5" stroke-dasharray="2 3" opacity="0.65" />
      <circle cx="185" cy="160" r="63" fill="url(#bCap)" stroke="#1E2638" stroke-width="1.2" />
      <circle cx="185" cy="160" r="11" fill="#0E121A" stroke="#283244" stroke-width="1.2" />

      <line x1="201.7" y1="153.3" x2="244.3" y2="136.0" stroke="url(#bNeedle)" stroke-width="5.5" stroke-linecap="round" filter="url(#bGlow)" />
      <circle cx="244.3" cy="136.0" r="3.5" fill="#FFFFFF" filter="url(#bGlow)" />
    </g>
  </g>

  <!-- RIGHT: CLEAN CONTENT BLOCK (NO DOT, NO BOX! AI IS BLUE, HUMAN IS ORANGE) -->
  <g transform="translate(360, 0)">
    <text x="0" y="110" font-family="'Segoe UI', Roboto, 'Inter', -apple-system, sans-serif" font-size="50" font-weight="900" letter-spacing="4" fill="#FFFFFF" filter="url(#bShadow)">
      HUMANIZER
    </text>

    <!-- Subtitle: Clean text, AI is glowing blue, Human is glowing orange -->
    <text x="0" y="152" font-family="'Segoe UI', Roboto, 'Inter', sans-serif" font-size="16" font-weight="800" letter-spacing="3">
      <tspan fill="#94A3B8">DIAL FROM </tspan>
      <tspan fill="#00F2FE" filter="url(#bGlow)">AI</tspan>
      <tspan fill="#94A3B8"> TO </tspan>
      <tspan fill="#FF7A00" filter="url(#bGlow)">HUMAN</tspan>
    </text>

    <text x="0" y="215" font-family="'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" fill-opacity="0.95">
      Clean your tracks. Remove AI watermarks.
    </text>

    <text x="0" y="245" font-family="'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14" font-weight="600" letter-spacing="1" fill="#64748B">
      Phase-neutral mathematical DSP • 100% audio quality retained
    </text>
  </g>
</svg>