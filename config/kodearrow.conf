[ids]
*

# --- Alt layer: bare navigation --------------------------------------
[alt]

# Core directional navigation
i = up
j = left
k = down
l = right

# Line boundaries
u = home
o = end

# Instant text deletion
p         = delete
semicolon = backspace

# Document paging
leftbrace  = pageup
apostrophe = pagedown

# --- Ctrl+Alt layer: word/line selection & word deletion -------------
[control+alt]

u = C-S-home
i = C-S-up
o = C-S-end
j = C-S-left
k = C-S-down
l = C-S-right

p         = C-delete
semicolon = C-backspace
