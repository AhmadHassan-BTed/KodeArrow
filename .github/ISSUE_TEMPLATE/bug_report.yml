name: Bug Report
description: Report an issue, crash, or unexpected behavior in NaSuno.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and resolve the problem quickly.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps or command line invocations used.
      placeholder: |
        1. Run 'nasuno clean input.mp3 output.wav --level aggressive'
        2. Inspect output waveform
        3. Encounter error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Details about your environment.
      value: |
        - OS: [e.g. Ubuntu 22.04 / Windows 11 / macOS 14]
        - Python Version: [e.g. 3.11.4]
        - NaSuno Version: [e.g. 2.0.0]
        - Installed Audio Packages: [e.g. soundfile, librosa, scipy]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Traceback
      description: Copy and paste terminal or log output if available.
      render: shell
